name: Build and Push to Azure Container Registry

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: komwj5irruyzicosureg.azurecr.io
          username: komwj5irruyzicosureg
          password: FW5fjGAJUTMgoZUMHZCYlQ7saHltN78A24lEaKsTfAcLpQy49tPCJQQJ99CCACHYHv6Eqg7NAAACAZCR2Ejw

      - name: Write .env file from secret
        run: printf '%s' "$ENV_SECRET" > src/.env
        env:
          ENV_SECRET: ${{ secrets.ENV }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: "v1.0"

      - name: Remove .env file
        if: always()
        run: rm -f src/.env
